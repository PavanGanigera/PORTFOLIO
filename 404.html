<!-- 404.html (place in project root) -->
<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>404 — Page not found</title>
    <style>
        body {
            font-family: Inter, system-ui, Arial;
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #050816;
            color: #fff
        }

        .card {
            padding: 28px;
            border-radius: 12px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.02));
            box-shadow: 0 12px 40px rgba(2, 6, 23, 0.6);
            max-width: 520px;
            text-align: center
        }

        h1 {
            font-size: 60px;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #7c3aed, #22d3ee);
            background-clip: text;
            color: transparent;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            margin: 8px 0 18px;
            color: #cbd5e1
        }

        a {
            display: inline-block;
            padding: 10px 18px;
            border-radius: 8px;
            background: linear-gradient(90deg, #7c3aed, #22d3ee);
            color: #fff;
            text-decoration: none
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>404</h1>
        <p>Looks like you followed a broken link or entered a URL that doesn't exist on this site.</p>
        <a href="/">Go to home</a>
    </div>
</body>

</html>
