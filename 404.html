<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Pavan Kumar</title>
  <style>
    body {
      margin: 0;
      background: #050816;
      color: #fff;
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 20px;
    }
    h1 {
      font-size: 60px;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #7c3aed, #22d3ee);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p { font-size: 18px; opacity: 0.8; margin-bottom: 20px; }

    a {
      display: inline-block;
      padding: 12px 24px;
      border-radius: 8px;
      background: linear-gradient(90deg, #7c3aed, #22d3ee);
      color: #fff;
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div>
    <h1>404</h1>
    <p>Oops! The page you're looking for doesn’t exist.</p>

</html>
