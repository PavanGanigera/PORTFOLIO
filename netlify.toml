# Netlify configuration for a static HTML/CSS/JS portfolio

[build]
  publish = "."        
  command = ""        

# Optional: force SPA fallback (not required for your site but safe to keep)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true

# Optional: enable compression
[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
